# AI Teaching Assistant System - Production Docker Compose
# 生产环境服务编排配置

version: '3.8'

services:
  # PostgreSQL数据库
  database:
    image: postgres:15-alpine
    container_name: ai-teacher-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_teacher_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ai_teacher}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    networks:
      - ai-teacher-network
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_teacher} -d ${POSTGRES_DB:-ai_teacher_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: ai-teacher-redis-prod
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./config/redis-prod.conf:/etc/redis/redis.conf:ro
    networks:
      - ai-teacher-network
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # 后端API服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-teacher-backend-prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ai_teacher}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ai_teacher_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY_FILE=/run/secrets/app_secret_key
    volumes:
      - backend_logs:/app/logs
      - uploads_data:/app/uploads
      - ./config/app-prod.env:/app/.env:ro
    networks:
      - ai-teacher-network
    secrets:
      - app_secret_key
      - openai_api_key
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # 前端应用
  frontend:
    build:
      context: ./ai-teacher-frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-teacher-frontend-prod
    volumes:
      - ./config/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-teacher-network
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # 反向代理和负载均衡
  nginx:
    image: nginx:alpine
    container_name: ai-teacher-nginx-prod
    volumes:
      - ./config/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-teacher-network
    depends_on:
      - backend
      - frontend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  uploads_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  ai-teacher-network:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  app_secret_key:
    file: ./secrets/app_secret_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt