# AI Teaching Assistant System - Python项目配置
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teaching-assistant"
version = "1.0.0"
description = "AI-powered teaching assistant system for programming education"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "AI Teaching Assistant Team", email = "dev@aiteacher.com"}
]
maintainers = [
    {name = "AI Teaching Assistant Team", email = "dev@aiteacher.com"}
]
keywords = ["ai", "education", "teaching", "programming", "assistant", "fastapi", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0,<0.105.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "sqlalchemy[asyncio]>=2.0.0,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "redis>=5.0.0,<5.1.0",
    "pydantic[email]>=2.4.0,<2.5.0",
    "python-jose[cryptography]>=3.3.0,<3.4.0",
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "openai>=1.0.0,<2.0.0",
    "loguru>=0.7.2,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<7.5.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "pytest-cov>=4.1.0,<4.2.0",
    "black>=23.9.0,<23.10.0",
    "isort>=5.12.0,<5.13.0",
    "flake8>=6.1.0,<6.2.0",
    "mypy>=1.6.0,<1.7.0",
    "pre-commit>=3.5.0,<3.6.0",
]
test = [
    "pytest>=7.4.0,<7.5.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "pytest-cov>=4.1.0,<4.2.0",
    "httpx>=0.25.0,<0.26.0",
]
docs = [
    "mkdocs>=1.5.0,<1.6.0",
    "mkdocs-material>=9.4.0,<9.5.0",
]

[project.urls]
"Homepage" = "https://github.com/ai-teaching-assistant/ai-teacher"
"Bug Reports" = "https://github.com/ai-teaching-assistant/ai-teacher/issues"
"Source" = "https://github.com/ai-teaching-assistant/ai-teacher"

[project.scripts]
ai-teacher-server = "app.main:main"
ai-teacher-db = "scripts.manage_db:cli"
ai-teacher-health = "scripts.health_check:health_check"

# Black配置
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort配置
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["app", "scripts", "tests"]

# mypy配置
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

# 忽略缺少类型存根的库
[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "alembic.*",
    "redis.*",
    "openai.*",
    "tiktoken.*"
]
ignore_missing_imports = true

# pytest配置
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "database: marks tests that require database",
    "redis: marks tests that require redis",
]
asyncio_mode = "auto"
env = [
    "ENVIRONMENT=testing",
    "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/ai_teacher_test",
    "REDIS_URL=redis://localhost:6379/1",
    "SECRET_KEY=test-secret-key-12345",
]

# Coverage配置
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit安全检查配置
[tool.bandit]
exclude_dirs = ["tests", "venv", "virtualenv"]
skips = ["B101", "B601"]  # 跳过assert和shell注入检查（在测试中常用）

# 依赖检查配置
[tool.safety]
ignore = []  # 忽略特定的安全漏洞ID

# 代码复杂度检查
[tool.radon]
cc_min = "B"
mi_min = "B"

# 任务运行器配置
[tool.invoke]
search_root = "."