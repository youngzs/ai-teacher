[tool:pytest]
# AI教学助手系统 pytest 配置文件

# 测试路径
testpaths = tests

# 最小pytest版本
minversion = 7.0

# 添加选项
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov=src
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --tb=short
    --maxfail=10
    --durations=10

# 测试标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    ai: AI功能测试
    e2e: 端到端测试
    performance: 性能测试
    slow: 慢速测试 (运行时间 > 10秒)
    auth: 认证相关测试
    database: 数据库相关测试
    redis: Redis相关测试
    external: 需要外部服务的测试
    smoke: 冒烟测试
    regression: 回归测试
    security: 安全测试
    load: 负载测试
    stress: 压力测试
    
# Python文件模式
python_files = test_*.py *_test.py

# Python类模式
python_classes = Test*

# Python函数模式  
python_functions = test_*

# 测试发现忽略路径
norecursedirs = 
    dist
    build
    .tox
    .git
    __pycache__
    .pytest_cache
    node_modules
    .venv
    venv

# 输出选项
console_output_style = progress

# 超时设置 (秒)
timeout = 300

# JUnit XML输出
junit_family = xunit2

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 警告过滤
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    
# 环境变量
env = 
    TESTING = 1
    DATABASE_URL = sqlite+aiosqlite:///./test.db
    REDIS_URL = redis://localhost:6379/1
    SECRET_KEY = test-secret-key-for-testing-only
    OPENAI_API_KEY = test-key
    AI_SERVICE_MODE = test